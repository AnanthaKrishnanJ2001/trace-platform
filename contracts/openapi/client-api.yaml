openapi: 3.0.3
info:
  title: TRACE Client API
  description: >
    Client ↔ Spring Boot Core contract (TDD §3.1). Extend this spec as each
    endpoint is implemented; treat it as the source of truth for request/
    response shapes rather than deriving it from controller code after the fact.
  version: 0.1.0

servers:
  - url: http://localhost:8080/api/v1

paths:
  /exceptions:
    post:
      summary: Ingest a new exception
      operationId: createException
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionEvent'
      responses:
        '201':
          description: Exception created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '../schemas/error-envelope.schema.json'

components:
  schemas:
    ExceptionEvent:
      type: object
      required: [source_system, event_type, references, raw_amount, currency, event_timestamp]
      properties:
        source_system:
          type: string
          maxLength: 50
          description: Must match a registered upstream system code (TDD §3.3).
        event_type:
          type: string
        references:
          type: object
          required: [invoice_id, po_id, vendor_id]
          properties:
            invoice_id:
              type: string
              pattern: '^[A-Z]{2,4}-\d{4,8}$'
            po_id:
              type: string
              pattern: '^[A-Z]{2,4}-\d{4,8}$'
            vendor_id:
              type: string
              pattern: '^[A-Z]{2,4}-\d{4,8}$'
        raw_amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Positive, max 2 decimal places.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 3-letter code.
        event_timestamp:
          type: string
          format: date-time

    Exception:
      type: object
      required: [exception_id, status, created_at, links]
      properties:
        exception_id:
          type: string
        status:
          type: string
          enum: [DETECTED, INVESTIGATING, INVESTIGATED, NEEDS_HUMAN_REVIEW, RESOLVED, REJECTED, INVESTIGATION_UNAVAILABLE]
        type:
          type: string
          nullable: true
          description: Set by classification (TASK-02); absent/null at ingestion time.
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          nullable: true
          description: Set by classification (TASK-02); absent/null at ingestion time.
        created_at:
          type: string
          format: date-time
        links:
          type: object
          required: [self, investigation]
          properties:
            self:
              type: string
            investigation:
              type: string
