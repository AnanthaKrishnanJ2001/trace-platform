openapi: 3.0.3
info:
  title: TRACE Client API
  description: >
    Client ↔ Spring Boot Core contract (TDD §3.1). Extend this spec as each
    endpoint is implemented; treat it as the source of truth for request/
    response shapes rather than deriving it from controller code after the fact.
  version: 0.1.0

servers:
  - url: http://localhost:8080/api/v1

paths:
  /exceptions/create:
    post:
      summary: Ingest a new exception
      description: >
        Optionally idempotent: send an `Idempotency-Key` header and a retry
        of the same request within the key's TTL (10 minutes) returns the
        original 201 response instead of creating a second exception (TDD
        §4.2). Without the header, every call creates a new exception.
      operationId: createException
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Client-generated unique key (e.g. a UUID) identifying this
            logical request. 1-128 characters from A-Z a-z 0-9 . _ : -
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionEvent'
      responses:
        '201':
          description: >
            Exception created — or, when `Idempotency-Key` matches an
            earlier completed request, that request's original response
            replayed (marked by `Idempotent-Replayed: true`).
          headers:
            Idempotent-Replayed:
              description: Present with value `true` only when this response is a replay.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        '400':
          description: Validation failed, or `Idempotency-Key` is malformed
          content:
            application/json:
              schema:
                $ref: '../schemas/error-envelope.schema.json'
        '409':
          description: >
            A request with the same `Idempotency-Key` is still being
            processed (`REQUEST_IN_PROGRESS`). Retry shortly.
          content:
            application/json:
              schema:
                $ref: '../schemas/error-envelope.schema.json'
        '422':
          description: >
            Referenced invoice or purchase order does not exist
            (`UNPROCESSABLE_REFERENCE`), or `Idempotency-Key` was already
            used with a different request body (`IDEMPOTENCY_KEY_REUSED`).
          content:
            application/json:
              schema:
                $ref: '../schemas/error-envelope.schema.json'

components:
  schemas:
    ExceptionEvent:
      type: object
      required: [source_system, event_type, references, raw_amount, currency, event_timestamp]
      properties:
        source_system:
          type: string
          maxLength: 50
          description: Must match a registered upstream system code (TDD §3.3).
        event_type:
          type: string
        references:
          type: object
          required: [invoice_id, po_id, vendor_id]
          properties:
            invoice_id:
              type: string
              pattern: '^[A-Z]{2,4}-\d{4,8}$'
            po_id:
              type: string
              pattern: '^[A-Z]{2,4}-\d{4,8}$'
            vendor_id:
              type: string
              pattern: '^[A-Z]{2,4}-\d{4,8}$'
        raw_amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Positive, max 2 decimal places.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 3-letter code.
        event_timestamp:
          type: string
          format: date-time

    Exception:
      type: object
      required: [exception_id, status, created_at, links]
      properties:
        exception_id:
          type: string
        status:
          type: string
          enum: [DETECTED, INVESTIGATING, INVESTIGATED, NEEDS_HUMAN_REVIEW, RESOLVED, REJECTED, INVESTIGATION_UNAVAILABLE]
        type:
          type: string
          nullable: true
          description: >
            Set synchronously at ingestion by the rule-based classifier
            (TASK-02) — always populated on a successful 201. Nullable only
            because no other producer of this schema (e.g. a future
            AI-classified type) is guaranteed to set it.
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          nullable: true
          description: >
            Set synchronously at ingestion by the rule-based classifier
            (TASK-02) — always populated on a successful 201. Nullable only
            because no other producer of this schema is guaranteed to set it.
        created_at:
          type: string
          format: date-time
        links:
          type: object
          required: [self, investigation]
          properties:
            self:
              type: string
            investigation:
              type: string
