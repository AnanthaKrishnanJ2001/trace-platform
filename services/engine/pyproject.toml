[tool.poetry]
name = "trace-engine"
version = "0.1.0"
description = "TRACE FastAPI AI Service — multi-agent investigation engine"
authors = ["TRACE Engineering"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.9"
pydantic-settings = "^2.5"
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }
pgvector = "^0.3"
redis = "^5.0"
httpx = "^0.28"
python-jose = { extras = ["cryptography"], version = "^3.4" }
google-genai = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.6"
# Contract validation (TASK-19): the OpenAPI/JSON-Schema files under contracts/
# must stay valid, and the engine's responses are checked against them.
openapi-spec-validator = "^0.7"
jsonschema = "^4.23"
pyyaml = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real Postgres (TEST_DATABASE_URL) and Redis (TEST_REDIS_URL); skipped otherwise",
]
