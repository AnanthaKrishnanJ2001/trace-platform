server:
  port: 8080

spring:
  application:
    name: trace-orchestrator

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trace}
    username: ${DB_USER:trace}
    password: ${DB_PASSWORD:trace}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration,filesystem:../../infra/db/migrations

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Internal service-to-service auth (TDD §1.2 — JWT issued by Spring Boot Core,
# audience-restricted to the FastAPI AI Service)
trace:
  security:
    internal-jwt:
      secret: ${INTERNAL_JWT_SECRET:change-me-in-env}
      audience: fastapi-ai-service
      ttl-seconds: 300
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  # Allow-list backing @RegisteredUpstreamSystem (TDD §3.3). Placeholder —
  # seeded with only the one code that appears anywhere in the spec; see the
  # gap noted on RegisteredUpstreamSystem.
  upstream-systems:
    codes:
      - SAP_AP_MODULE
  # Idempotency guard for POST /api/v1/exceptions/create (TDD §4.2). A key is
  # held for `ttl` once its request completes; `in-progress-ttl` is shorter so
  # a crash mid-request only blocks retries briefly.
  idempotency:
    key-prefix: "idem:"
    ttl: 10m
    in-progress-ttl: 30s
  # Deviation-percentage thresholds for ExceptionClassifier (TASK-02 AC).
  # Each *-max-pct is the exclusive upper bound of its band — a deviation AT
  # the threshold falls into the next, more severe band:
  #   LOW    < low-max-pct
  #   MEDIUM >= low-max-pct    and < medium-max-pct
  #   HIGH   >= medium-max-pct and < high-max-pct
  #   CRITICAL >= high-max-pct
  classification:
    severity-bands:
      low-max-pct: 5.0
      medium-max-pct: 15.0
      high-max-pct: 30.0

# Resilience4j config for calls to the FastAPI AI Service (TDD §5.1)
resilience4j:
  circuitbreaker:
    instances:
      investigationService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  timelimiter:
    instances:
      investigationService:
        timeoutDuration: 8s
        cancelRunningFuture: true

  retry:
    instances:
      investigationService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.trace: INFO
