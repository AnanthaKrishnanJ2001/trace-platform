openapi: 3.0.3
info:
  title: TRACE Client API
  description: >
    Client ↔ Spring Boot Core contract (TDD §3.1). Extend this spec as each
    endpoint is implemented; treat it as the source of truth for request/
    response shapes rather than deriving it from controller code after the fact.
  version: 0.1.0

servers:
  - url: http://localhost:8080/api/v1

paths:
  /exceptions:
    post:
      summary: Ingest a new exception
      operationId: createException
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionEvent'
      responses:
        '201':
          description: Exception created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '../schemas/error-envelope.schema.json'

components:
  schemas:
    ExceptionEvent:
      type: object
      required: [source_system, event_type, references, raw_amount, currency, event_timestamp]
      properties:
        source_system:
          type: string
          maxLength: 50
        event_type:
          type: string
        references:
          type: object
          properties:
            invoice_id:
              type: string
            po_id:
              type: string
            vendor_id:
              type: string
        raw_amount:
          type: number
          format: double
        currency:
          type: string
          minLength: 3
          maxLength: 3
        event_timestamp:
          type: string
          format: date-time

    Exception:
      type: object
      properties:
        exception_id:
          type: string
        status:
          type: string
          enum: [DETECTED, INVESTIGATING, INVESTIGATED, NEEDS_HUMAN_REVIEW, RESOLVED, REJECTED, INVESTIGATION_UNAVAILABLE]
        type:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        created_at:
          type: string
          format: date-time
