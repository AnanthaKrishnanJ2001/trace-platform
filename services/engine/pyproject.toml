[tool.poetry]
name = "trace-engine"
version = "0.1.0"
description = "TRACE FastAPI AI Service — multi-agent investigation engine"
authors = ["TRACE Engineering"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.9"
pydantic-settings = "^2.5"
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }
pgvector = "^0.3"
redis = "^5.0"
httpx = "^0.27"
python-jose = { extras = ["cryptography"], version = "^3.3" }
google-cloud-aiplatform = "^1.70"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
